services:
  bot:
    build: .
    container_name: tg_soundbot
    restart: unless-stopped
    env_file:
      - .env
    # Port 8000 is intentionally NOT published to the host. The
    # bot is reached internally by nginx over the shared `web` network.
    # Uncomment the next two lines if you want direct host access too:
    # ports:
    #   - "${PORT:-8000}:8000"
    volumes:
      - sounds_data:/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Nightly tar of /data to ./backups on the host. Keeps the most recent
  # 7 archives; older ones are pruned. Mounts the data volume read-only
  # so it can never corrupt live writes.
  backup:
    image: alpine:3.19
    container_name: tg_soundbot_backup
    restart: unless-stopped
    depends_on:
      - bot
    volumes:
      - sounds_data:/data:ro
      - ./backups:/backups
    command: >
      sh -c "
        mkdir -p /backups;
        while true; do
          ts=$$(date -u +%Y-%m-%d-%H%M);
          tar czf /backups/sounds-$${ts}.tar.gz -C /data . 2>/dev/null && echo \"backup: wrote /backups/sounds-$${ts}.tar.gz\";
          ls -1t /backups/sounds-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f;
          sleep 86400;
        done
      "

volumes:
  sounds_data:

networks:
  web:
    external: true
